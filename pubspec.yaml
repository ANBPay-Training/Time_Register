name: time_register_flutter
description: "A time registration Flutter application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # --- State Management ---
  flutter_riverpod: ^2.5.1

  # --- Storage ---
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0

  # --- Networking ---
  dio: ^5.4.0

  # --- Utilities ---
  intl: ^0.19.0
  equatable: ^2.0.5

  # --- UI ---
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
